services:
  - type: web
    name: taskmate
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
